name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          cd web-ui && pnpm install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK to Supabase Storage
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "DEBUG: SUPABASE_URL length = ${#SUPABASE_URL}"
          echo "DEBUG: SUPABASE_SERVICE_KEY length = ${#SUPABASE_SERVICE_KEY}"
          
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "DEBUG: APK_FILE = ${APK_FILE}"
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          
          ls -la "$APK_FILE"
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="orangechat-debug-${TIMESTAMP}.apk"
          
          # Upload to Supabase Storage
          echo "Uploading ${FILENAME}..."
          curl -v -X POST \
            "${SUPABASE_URL}/storage/v1/object/apk-releases/${FILENAME}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${APK_FILE}" 2>&1
          
          # Also upload as "latest" for easy access
          echo "Uploading latest..."
          curl -v -X POST \
            "${SUPABASE_URL}/storage/v1/object/apk-releases/orangechat-debug-latest.apk" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary @"${APK_FILE}" 2>&1
          
          echo "✅ Done. Check: ${SUPABASE_URL}/storage/v1/object/public/apk-releases/${FILENAME}"
