name: Build OrangeChat

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          cd web-ui && pnpm install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy"
                  }
                ]
              }
            ]
          }
          GSEOF

      - name: Generate keystore and build release
        run: |
          keytool -genkey -v -keystore app/release.keystore -storepass orangechat123 -alias orangechat -keypass orangechat123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OrangeChat,OU=Dev,O=OrangeChat,L=Beijing,ST=Beijing,C=CN"
          echo "storeFile=release.keystore" > local.properties
          echo "storePassword=orangechat123" >> local.properties
          echo "keyAlias=orangechat" >> local.properties
          echo "keyPassword=orangechat123" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "No release APK found!"
            exit 1
          fi
          echo "Uploading: $APK_FILE"
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          gh release create latest --target master --title "聿迹 Latest" --notes "arm64 release APK" --prerelease "$APK_FILE#聿迹.apk"
          echo "Done"
