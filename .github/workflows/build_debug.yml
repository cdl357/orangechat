name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          cd web-ui && pnpm install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -storepass orangechat123 -alias orangechat -keypass orangechat123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OrangeChat,OU=Dev,O=OrangeChat,L=Beijing,ST=Beijing,C=CN"

      - name: Build Release APK (arm64 only)
        run: |
          chmod +x gradlew
          # Patch build.gradle to add release signing config
          cat >> app/build.gradle.kts << 'SIGNING'
          
          android.signingConfigs.create("release") {
              storeFile = file("release.keystore")
              storePassword = "orangechat123"
              keyAlias = "orangechat"
              keyPassword = "orangechat123"
          }
          android.buildTypes.getByName("release") {
              signingConfig = android.signingConfigs.getByName("release")
          }
          SIGNING
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a 2>&1 || {
            echo "Release failed, trying debug with signing override..."
            ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a
          }

      - name: Find and upload APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Searching for APK files..."
          find app/build -name "*.apk" -type f 2>/dev/null || true
          APK_FILE=$(find app/build -name "*release*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found: $APK_FILE"
          ls -la "$APK_FILE"
          gh release delete latest-debug --yes 2>/dev/null || true
          git push origin :refs/tags/latest-debug 2>/dev/null || true
          gh release create latest-debug --title "OrangeChat Latest" --notes "arm64 release APK" --prerelease "$APK_FILE#orangechat-release.apk"
          echo "Done"
