name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          cd web-ui && pnpm install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US"

      - name: Build Debug APK (arm64 only)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Find and upload APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Search for APK files everywhere
          echo "Searching for APK files..."
          find app/build/outputs -name "*.apk" -type f 2>/dev/null || true
          find app/build -name "*.apk" -type f 2>/dev/null || true
          
          APK_FILE=$(find app/build -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found anywhere!"
            find app/build -type d | head -20
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          ls -la "$APK_FILE"
          
          # Upload as artifact
          
          # Delete old debug release if exists
          gh release delete latest-debug --yes 2>/dev/null || true
          git push origin :refs/tags/latest-debug 2>/dev/null || true
          
          # Create new release with APK
          gh release create latest-debug \
            --title "最新Debug版 ($(date +%Y-%m-%d))" \
            --notes "自动编译 arm64 debug APK" \
            --prerelease \
            "$APK_FILE#orangechat-debug.apk"
          
          echo "✅ Release: https://github.com/cdl357/orangechat/releases/tag/latest-debug"
