name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm and web-ui dependencies
        run: |
          npm install -g pnpm
          cd web-ui && pnpm install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -storepass orangechat123 -alias orangechat -keypass orangechat123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OrangeChat,OU=Dev,O=OrangeChat,L=Beijing,ST=Beijing,C=CN"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Re-sign APK with release key
        run: |
          APK_FILE=$(find app/build -name "*arm64*debug.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build -name "*.apk" -type f | head -1)
          fi
          echo "Original APK: $APK_FILE"
          
          # Find apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          
          # Zipalign
          $ZIPALIGN -f 4 "$APK_FILE" "${APK_FILE%.apk}-aligned.apk"
          
          # Re-sign with release key
          $APKSIGNER sign --ks app/release.keystore --ks-pass pass:orangechat123 --ks-key-alias orangechat --key-pass pass:orangechat123 --out "${APK_FILE%.apk}-signed.apk" "${APK_FILE%.apk}-aligned.apk"
          
          echo "Signed APK created"
          ls -la "${APK_FILE%.apk}-signed.apk"

      - name: Upload to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find app/build -name "*-signed.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "No signed APK found!"
            exit 1
          fi
          echo "Uploading: $APK_FILE"
          gh release delete latest-debug --yes 2>/dev/null || true
          git push origin :refs/tags/latest-debug 2>/dev/null || true
          gh release create latest-debug --title "OrangeChat Latest" --notes "arm64 release-signed APK" --prerelease "$APK_FILE#orangechat.apk"
          echo "Done"
